<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Constitutive model discovery with SINDy</title>
  <desc id="d">Rheological data of a complex fluid are converted into a library of candidate terms; sparse regression selects a few terms, which yields an interpretable constitutive equation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="300" rx="14" fill="#ffffff"/>

  <!-- 1. Rheological data -->
  <text x="130" y="40" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Rheological data</text>
  <line x1="40" y1="230" x2="230" y2="230" stroke="#444" stroke-width="1.5"/>
  <line x1="40" y1="230" x2="40" y2="70" stroke="#444" stroke-width="1.5"/>
  <text x="135" y="252" font-size="13" text-anchor="middle" fill="#555">time <tspan font-style="italic">t</tspan></text>
  <text x="28" y="150" font-size="13" text-anchor="middle" fill="#555" transform="rotate(-90 28 150)">stress <tspan font-style="italic">σ</tspan></text>
  <path d="M42,228 C70,130 95,95 130,92 C165,90 195,96 226,98" fill="none" stroke="#2f5d8a" stroke-width="2.5"/>
  <g fill="#c0392b">
    <circle cx="52" cy="198" r="3.5"/><circle cx="64" cy="160" r="3.5"/><circle cx="78" cy="128" r="3.5"/>
    <circle cx="96" cy="108" r="3.5"/><circle cx="118" cy="95" r="3.5"/><circle cx="142" cy="93" r="3.5"/>
    <circle cx="170" cy="92" r="3.5"/><circle cx="198" cy="96" r="3.5"/><circle cx="222" cy="97" r="3.5"/>
  </g>
  <text x="135" y="282" font-size="13" text-anchor="middle" fill="#555">shear / extensional flows</text>

  <line x1="248" y1="150" x2="290" y2="150" stroke="#2f5d8a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 2. Library of candidate terms -->
  <text x="420" y="40" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Library of candidate terms</text>
  <rect x="300" y="60" width="240" height="180" rx="8" fill="#e8eef5" stroke="#2f5d8a" stroke-width="1.5"/>
  <g font-size="15" font-style="italic" fill="#222" text-anchor="middle">
    <text x="340" y="92">σ</text><text x="420" y="92">γ̇</text><text x="500" y="92">σγ̇</text>
    <text x="340" y="132">σ²</text><text x="420" y="132">γ̇σ²</text><text x="500" y="132">tr(σ)σ</text>
    <text x="340" y="172">σ·∇v</text><text x="420" y="172">∇vᵀ·σ</text><text x="500" y="172">σ³</text>
    <text x="420" y="212" font-style="normal">⋯</text>
  </g>
  <text x="420" y="268" font-size="13" text-anchor="middle" fill="#555">Θ(σ, ∇v): nonlinear functions of the state</text>

  <line x1="550" y1="150" x2="592" y2="150" stroke="#2f5d8a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 3. Sparse regression -->
  <text x="660" y="40" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Sparse regression</text>
  <g>
    <rect x="618" y="62" width="84" height="22" fill="#2f5d8a"/>
    <rect x="618" y="88" width="84" height="22" fill="#f1f1f1" stroke="#ccc"/>
    <rect x="618" y="114" width="84" height="22" fill="#2f5d8a"/>
    <rect x="618" y="140" width="84" height="22" fill="#f1f1f1" stroke="#ccc"/>
    <rect x="618" y="166" width="84" height="22" fill="#f1f1f1" stroke="#ccc"/>
    <rect x="618" y="192" width="84" height="22" fill="#2f5d8a"/>
    <rect x="618" y="218" width="84" height="22" fill="#f1f1f1" stroke="#ccc"/>
  </g>
  <text x="660" y="268" font-size="13" text-anchor="middle" fill="#555">Few nonzero coefficients <tspan font-style="italic">ξ</tspan></text>

  <line x1="716" y1="150" x2="758" y2="150" stroke="#2f5d8a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 4. Constitutive equation -->
  <text x="852" y="40" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Constitutive model</text>
  <rect x="766" y="100" width="182" height="100" rx="10" fill="#eef5ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="857" y="146" font-size="17" font-style="italic" text-anchor="middle" fill="#222">dσ/dt = Θ(σ, ∇v) ξ</text>
  <text x="857" y="176" font-size="13" text-anchor="middle" fill="#555">interpretable equation</text>
  <text x="857" y="268" font-size="13" text-anchor="middle" fill="#555">e.g., Rheo-SINDy</text>
</svg>
